# Example Niche Profile Configuration
id: primary
name: "AI Engineering & Coding Automation"
one_sentence_definition: "Practical AI coding agents, developer automation workflows, and local LLM tooling tested on production tasks."
audience: "Software developers, technical founders, and automation engineers."
audience_regions:
  - "North America"
  - "Europe"
  - "Global Developer Community"

target_skill_levels:
  - "Intermediate Software Engineer"
  - "Senior Fullstack / DevOps Engineer"
  - "Technical Lead"

audience_goals:
  - "Automate repetitive coding and testing tasks safely"
  - "Deploy local models with minimal latency and zero cloud data leaks"
  - "Objectively evaluate agent claims against messy legacy codebases"

primary_problems:
  - "Agent benchmark claims do not match real-world coding performance."
  - "High API costs and token limits for agentic workflows."
  - "Difficulty integrating local LLMs with developer IDEs."
  - "Maintaining deterministic control over non-deterministic models."

allowed_topics:
  - "coding agents"
  - "local LLMs"
  - "developer tools"
  - "AI engineering"
  - "IDE integrations"
  - "evals and benchmarks"
  - "workflow automation"

adjacent_topics:
  - "software architecture"
  - "DevOps"
  - "vector databases"
  - "open source models"

blocked_topics:
  - "crypto/web3 trading"
  - "general consumer gadgets"
  - "passive income schemes"
  - "clickbait AI news without code/tests"

topic_exceptions:
  - topic_or_keyword: "passive income schemes"
    allowed_contexts:
      - "debunking"
      - "criticism"
      - "quotation"
    notes: "Educational debunking of passive income claims is permitted."
  - topic_or_keyword: "replaced all coders"
    allowed_contexts:
      - "negation"
      - "criticism"
      - "quotation"
    notes: "Critical analysis or negation of replacement claims is permitted."

must_have_signals:
  - "code repository"
  - "reproducible benchmark"
  - "documentation or paper"
  - "practical tool release"

negative_keywords:
  - "get rich quick"
  - "secret trick"
  - "replaced all coders"
  - "100x money"

preferred_source_types:
  - "github_releases"
  - "engineering_blogs"
  - "arxiv_papers"
  - "curated_rss"

content_pillars:
  - id: "agent_benchmarks"
    name: "Coding Agent Stress Tests"
    description: "Real-world testing of Claude 3.7, Gemini 2.5, Qwen 2.5 Coder on dirty repos."
    keywords:
      - "coding agents"
      - "benchmark"
      - "stress test"
      - "dirty repo"
      - "agent evaluation"
    synonyms:
      - "Agent benchmarks"
      - "Coding agent evals"
    examples:
      - "Benchmarking AI coding agents on large legacy repositories"
  - id: "local_tooling"
    name: "Local Models & Tooling"
    description: "Ollama, vLLM, DeepSeek, and local inference benchmarks."
    keywords:
      - "ollama"
      - "vllm"
      - "local inference"
      - "deepseek"
      - "local llm"
    synonyms:
      - "Local LLM setups"
      - "On-premise AI tooling"
    examples:
      - "Local Qwen 2.5 Coder vs Claude 3.7 latency and token cost analysis"
  - id: "automation_recipes"
    name: "Production Automation Recipes"
    description: "End-to-end coding workflows that save 5+ hours/week."
    keywords:
      - "workflow automation"
      - "developer productivity"
      - "automation recipe"
      - "ci script"
    synonyms:
      - "Developer automation recipes"
    examples:
      - "Building deterministic AI pipelines with local tooling"

commercial_intent_topics:
  - "developer productivity tools"
  - "cloud GPU hosting"
  - "IDE extensions"

evergreen_topics:
  - "how to set up local coding assistant"
  - "evaluating LLM code quality"
  - "building deterministic AI pipelines"
